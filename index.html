<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bar Game</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="progress-bars">
    <div class="progress-bar" style="border-color: black;">
        <div id="black" style="width: 0%;"></div>
    </div>
    <div class="progress-bar" style="border-color: purple;">
        <div id="purple" style="width: 0%;"></div>
    </div>
    <div class="progress-bar" style="border-color: green;">
        <div id="green" style="width: 0%;"></div>
    </div>
    <div class="progress-bar" style="border-color: blue;">
        <div id="blue" style="width: 0%;"></div>
    </div>
    <div class="progress-bar" style="border-color: #D2B48C;">
        <div id="yellow" style="width: 0%;"></div>
    </div>
</div>
<div class="buttons">
    <div class="row purple-buttons-1"></div>
    <div class="row purple-buttons-2"></div>
    <div class="row green-buttons-1"></div>
    <div class="row green-buttons-2"></div>
    <div class="row blue-buttons-1"></div>
    <div class="row blue-buttons-2"></div>
    <div class="row yellow-buttons-1"></div>
    <div class="row yellow-buttons-2"></div>
    <div class="row"><button class="common-button">2</button></div>
    <div class="row">
        <button class="increase-counter">+1</button>
        <button class="clear">clear</button>
    </div>
</div>
<div class="counter">MP: <span id="counter">5</span></div>
<script src="script.js"></script>
</body>
</html>
